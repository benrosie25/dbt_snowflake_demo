version: 2

sources:
  - name: jaffle_shop
    database: demo
    schema: dbt_ddemo
    tables:
      - name: orders
        description: Raw orders data from the Jaffle Shop.
        freshness:
          warn_after:
            count: 12
            period: hour
          error_after:
            count: 24
            period: hour
      - name: customers
        description: Raw customer data from the Jaffle Shop.
      - name: payments
        description: Raw payment data from the Jaffle Shop.
  - name: jaffle_raw
    database: demo
    schema: raw
    tables:
      - name: ORDERS
        description: Raw orders data from the Jaffle Shop.
        freshness:
          warn_after:
            count: 12
            period: hour
          error_after:
            count: 24
            period: hour
      - name: customers
        description: Raw customer data from the Jaffle Shop.
      - name: payments
        description: Raw payment data from the Jaffle Shop.